<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101828">
  <title>Operation Crackdown</title>
  <link rel="stylesheet" href="/styles.css?v=0.1.1">
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth-card" hidden>
      <div class="brand-mark">OC</div>
      <h1>Operation Crackdown</h1>
      <p id="auth-copy" class="muted"></p>
      <form id="auth-form">
        <label>Username<input name="username" autocomplete="username" required minlength="3"></label>
        <label id="display-name-row" hidden>Display name<input name="displayName" autocomplete="name"></label>
        <label id="password-row" hidden>Dashboard password<input name="password" type="password" autocomplete="new-password" minlength="10"></label>
        <label id="pin-row">PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" autocomplete="current-password" required></label>
        <button class="primary wide" type="submit">Continue</button>
        <p id="auth-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="dashboard" hidden>
      <header class="topbar">
        <div>
          <p class="eyebrow">HOUSEHOLD FOCUS</p>
          <h1>Operation Crackdown</h1>
        </div>
        <div class="top-actions">
          <button id="refresh-button" class="secondary">Refresh</button>
          <button id="enroll-button" class="primary">Add device</button>
          <button id="parent-button" class="secondary">Add parent</button>
          <button id="logout-button" class="quiet">Sign out</button>
        </div>
      </header>

      <div id="notice" class="notice" hidden></div>
      <section id="empty-state" class="empty" hidden>
        <h2>No enrolled devices yet</h2>
        <p>Create an enrollment code, then run the client installer on a device.</p>
        <button class="primary" data-action="open-enroll">Create enrollment code</button>
      </section>
      <section id="devices" class="device-grid" aria-live="polite"></section>

      <details class="audit-panel">
        <summary>Recent activity</summary>
        <div id="audit-list" class="audit-list"></div>
      </details>
    </section>
  </main>

  <dialog id="enroll-dialog">
    <form method="dialog" class="dialog-card">
      <button class="dialog-close" value="cancel" aria-label="Close">×</button>
      <p class="eyebrow">NEW CLIENT</p>
      <h2>Enroll a device</h2>
      <div id="enrollment-result">
        <p>Create a one-time code that remains valid for ten minutes.</p>
        <button id="create-code-button" class="primary" type="button">Create code</button>
      </div>
    </form>
  </dialog>

  <dialog id="parent-dialog">
    <form id="parent-form" class="dialog-card">
      <button class="dialog-close" type="button" data-close-dialog="parent-dialog" aria-label="Close">×</button>
      <p class="eyebrow">PARENT ACCESS</p>
      <h2>Add another parent</h2>
      <label>Display name<input name="displayName" required></label>
      <label>Username<input name="username" required minlength="3"></label>
      <label>Dashboard password<input name="password" type="password" required minlength="10"></label>
      <label>Local PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" required></label>
      <button class="primary" type="submit">Add parent</button>
      <p id="parent-error" class="error"></p>
    </form>
  </dialog>

  <template id="device-template">
    <article class="device-card">
      <header class="device-header">
        <div>
          <div class="device-title-row"><span class="status-dot"></span><h2 class="device-name"></h2></div>
          <p class="device-meta muted"></p>
        </div>
        <div class="device-header-actions">
          <span class="policy-status"></span>
          <button class="small quiet remove-device" data-remove-device>Remove device</button>
        </div>
      </header>

      <section class="internet-panel">
        <div class="internet-heading">
          <div><p class="eyebrow">DEVICE INTERNET</p><h3>Internet access</h3></div>
          <span class="internet-state"></span>
        </div>
        <div class="internet-paused" hidden>
          <p class="internet-message"></p>
          <button class="primary restore-internet" data-internet-restore>Restore internet</button>
        </div>
        <form class="internet-pause-form">
          <label>Message shown on their screen
            <textarea name="message" maxlength="240" rows="2" placeholder="Feed the dogs, then let us know." required></textarea>
          </label>
          <button class="danger" type="submit">Pause internet and show message</button>
        </form>
        <p class="muted master-help">The client keeps its private dashboard connection so Restore internet still works.</p>
      </section>

      <div class="controls-block">
        <div class="section-heading">
          <div><p class="eyebrow">MASTER CONTROL</p><h3>Blocking</h3></div>
          <label class="duration-label">For
            <select class="duration-select">
              <option value="0" selected>Until changed</option>
              <option value="30">30 minutes</option>
              <option value="60">1 hour</option>
              <option value="120">2 hours</option>
            </select>
          </label>
        </div>
        <div class="segmented master-buttons">
          <button data-master-action="enable">On</button>
          <button data-master-action="disable">Off</button>
        </div>
        <p class="muted master-help">Off temporarily allows everything without forgetting your individual selections.</p>
      </div>

      <section>
        <h3>Apps and services</h3>
        <div class="service-list"></div>
      </section>

      <section class="websites-panel">
        <h3>Additional websites</h3>
        <p class="muted target-help">Paste a domain or full URL. The entire hostname will be blocked on this device.</p>
        <form class="website-form">
          <input name="url" type="text" inputmode="url" placeholder="example.com or https://example.com/page" required>
          <input name="displayName" type="text" placeholder="Name (optional)" maxlength="100">
          <button class="primary" type="submit">Add and block</button>
        </form>
        <div class="website-list"></div>
      </section>

      <details class="targets-panel">
        <summary>Discovered application targets <span class="target-count"></span></summary>
        <p class="muted target-help">Choose additional running applications to block. Only application identity is reported—never window titles or content.</p>
        <div class="targets-list"></div>
      </details>

      <details class="activity-panel">
        <summary>Activity <span class="activity-count"></span></summary>
        <p class="muted target-help">Application starts/stops and browser hostnames only. Window titles, page paths, searches, content, and command lines are never collected.</p>
        <div class="segmented activity-filters">
          <button class="active" data-activity-filter="all">All</button>
          <button data-activity-filter="applications">Applications</button>
          <button data-activity-filter="websites">Websites</button>
        </div>
        <div class="activity-group" data-activity-group="applications">
          <h4>Applications</h4>
          <div class="activity-list application-activity-list"></div>
        </div>
        <div class="activity-group" data-activity-group="websites">
          <h4>Websites</h4>
          <div class="activity-list website-activity-list"></div>
        </div>
      </details>
    </article>
  </template>

  <script type="module" src="/app.js?v=0.3.4"></script>
</body>
</html>
